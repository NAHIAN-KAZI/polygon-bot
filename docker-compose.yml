services:
  backend:
    build: .
    ports:
      # Reachable from the network: the app's chat endpoint is served here. Keep
      # DEMO_PORTAL_AUTOFILL_API_KEY=false (.env) while it is; the portal hands out API_KEY
      # to anyone who can reach it. Autofill is only safe with "127.0.0.1:8000:8000".
      - "8000:8000"
    env_file:
      - .env
    environment:
      # The port above is network-reachable, and /demo-config would hand API_KEY to anyone
      # who can call it. Compose environment wins over .env, so autofill cannot be switched
      # on by accident; to use it, bind the port to 127.0.0.1 and remove this line.
      DEMO_PORTAL_AUTOFILL_API_KEY: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
  app_data:
