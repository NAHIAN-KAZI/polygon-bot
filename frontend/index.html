<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polygon Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-glyph">&#10022;</span>
        <span class="brand-text">Polygon <b>Bot</b></span>
      </div>
      <div class="actions">
        <button id="ctxChip" class="pill ctx-pill" type="button" disabled hidden
                title="Largest prompt sent to the model for the last message, out of its context window">
          <span class="ctx-label">Context</span>
          <span class="ctx-bar"><i id="ctxFill"></i></span>
          <span id="ctxValue">0 / 0</span>
        </button>
        <button id="healthChip" class="pill" type="button" disabled>
          <i class="dot"></i><span id="healthLabel">…</span>
        </button>
        <button id="keyBtn" class="pill" type="button">
          <i class="dot"></i>Key
        </button>
        <button id="drawerBtn" class="pill pill-icon" type="button" title="Knowledge base">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4H15l5 5v8.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Z" stroke="currentColor" stroke-width="1.6"/><path d="M14 4v4.5a1 1 0 0 0 1 1H19" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
    </header>

    <main class="chat-area">
      <div id="messages" class="messages">
        <div class="intro">
          <div class="intro-glyph">&#10022;</div>
          <h1>Ask Polygon Bot anything</h1>
          <p>Answers are grounded in whatever's been added to the knowledge base.</p>
          <button id="introKeyBtn" class="intro-key-link" type="button" hidden>Set your API key to get started &rarr;</button>
        </div>
      </div>

      <details id="routingExtras" class="routing-extras">
        <summary>Banking-service test fields (optional)</summary>
        <div class="routing-extras-grid">
          <label>
            <span>category</span>
            <input id="fldCategory" type="text" placeholder="e.g. account_info" autocomplete="off" />
          </label>
          <label>
            <span>service</span>
            <input id="fldService" type="text" placeholder="e.g. balance" autocomplete="off" />
          </label>
          <label>
            <span>subservice</span>
            <input id="fldSubservice" type="text" placeholder="optional" autocomplete="off" />
          </label>
          <label class="full">
            <span>payload (JSON)</span>
            <textarea id="fldPayload" rows="2" placeholder='e.g. {"amount": 42.5}'></textarea>
          </label>
          <label class="full">
            <span>Authorization bearer token</span>
            <input id="fldAuthToken" type="text" placeholder="JWT (sent as Authorization: Bearer &lt;token&gt;)" autocomplete="off" />
          </label>
          <div class="full login-row">
            <input id="loginUsername" type="text" placeholder="username" autocomplete="username" />
            <input id="loginPassword" type="password" placeholder="password" autocomplete="current-password" />
            <button id="loginBtn" type="button" class="login-btn">Login</button>
          </div>
          <div id="loginStatus" class="login-status full"></div>
        </div>
      </details>

      <div id="attachTray" class="attach-tray" hidden>
        <img id="attachThumb" alt="Attached image" />
        <span id="attachName" class="attach-name"></span>
        <button id="attachRemove" type="button" class="attach-remove" aria-label="Remove image">&times;</button>
      </div>
      <form id="chatForm" class="composer">
        <button id="attachBtn" type="button" class="attach-btn" aria-label="Attach image" title="Attach an image (or paste one)" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="14" rx="2.5" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="10" r="1.6" stroke="currentColor" stroke-width="1.4"/><path d="m4.5 17 4.8-4.6a1.2 1.2 0 0 1 1.6 0L14 15.2l2-1.8a1.2 1.2 0 0 1 1.6 0l2.9 2.7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
        <input id="chatInput" type="text" placeholder="Message Polygon Bot..." autocomplete="off" />
        <span id="recTimer" class="rec-timer" hidden>0:00</span>
        <button id="micBtn" type="button" class="mic-btn" aria-label="Record a voice message" title="Record a voice message" hidden>
          <svg class="mic-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="9" y="3.5" width="6" height="11" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg class="stop-icon" width="14" height="14" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/></svg>
        </button>
        <button type="submit" class="send-btn" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </main>
  </div>

  <div id="drawerOverlay" class="drawer-overlay"></div>
  <aside id="drawer" class="drawer">
    <div class="drawer-head">
      <h2>Knowledge base</h2>
      <button id="drawerClose" class="icon-btn" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <form id="uploadForm" class="upload-form">
      <label class="dropzone" for="fileInput">
        <span class="dz-icon">+</span>
        <span class="dz-text" id="dzText">Add document</span>
      </label>
      <input id="fileInput" type="file" accept=".pdf,.docx,.txt,.md" required hidden />
      <button type="submit" class="upload-btn">Upload</button>
    </form>
    <div id="uploadStatus" class="upload-status"></div>

    <ul id="docList" class="doc-list"></ul>
  </aside>

  <script src="/app.js"></script>
</body>
</html>
